name: bt_kit
description: Bluetooth Classic and BLE for Android and iOS through direct native interop, with a unified Dart API on top. Central and peripheral roles, L2CAP, free for every use.
version: 1.0.1
repository: https://github.com/velzosoft/bt_kit
issue_tracker: https://github.com/velzosoft/bt_kit/issues
topics:
  - bluetooth
  - ble
  - bluetooth-low-energy

platforms:
  android:
  ios:

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  code_assets: ^2.2.0
  collection: ^1.19.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  jni: ^1.2.1
  jni_flutter: ^1.1.0
  logging: ^1.3.0
  meta: ^1.17.0
  native_toolchain_c: ^0.19.6
  objective_c: ^9.6.4

dev_dependencies:
  analyzer: ^14.7.0
  fake_async: ^1.3.3
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jnigen: ^1.1.1
  path: ^1.9.1
  pub_semver: ^2.2.1
  xml: ^6.6.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.btkit
        pluginClass: BtKitPlugin
