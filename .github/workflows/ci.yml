name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool hook example/lib example/test example/integration_test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Validate package
        run: flutter pub publish --dry-run

  android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release

  ios:
    name: Build iOS example
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS app
        working-directory: example
        run: flutter build ios --release --no-codesign
