name: bt_radar
description: Bluetooth Radar, the bt_kit example app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  audioplayers: ^6.8.1
  bt_kit:
    path: ../
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
